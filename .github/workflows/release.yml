# Builds SBPRO on every push. Pushes to the default branch (and tags) put
# sbpro-VERSION.zip on the GitHub release vVERSION, VERSION from the Makefile.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW, NASM and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 g++-mingw-w64-i686 nasm zip unzip wget

      - name: Version
        run: |
          VERSION=$(make -s print-version)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$VERSION in the Makefile"
            exit 1
          fi

      - name: Build SBPRO.DLL and SBTEST.COM (MinGW)
        run: make jlm

      - name: Build SBPM.EXE and SBTESTPM.EXE (DJGPP)
        run: |
          docker run --rm -v "$PWD":/src -u "$(id -u):$(id -g)" djfdyuruiry/djgpp /bin/sh -c "cd /src && \
            gcc -O2 -Wall -DSBPRO_VERSION_NUM=$VERSION -o sbpm.exe sbpm.c sbpmtrap.S && \
            gcc -O2 -Wall -DSBPRO_VERSION_NUM=$VERSION -o sbtestpm.exe sbtestpm.c"

      - name: Package (driver, scripts, JEMMEX/JLOAD, HDPMI32i, tests)
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: sbpro-${{ env.VERSION }}
          path: release/

      # A push to the default branch publishes release v<VERSION> (created the
      # first time, its zip replaced on later pushes). Bump VERSION in the
      # Makefile to start a new release. Pushing a tag works too.
      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          (github.ref_type == 'tag' ||
           github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "sbpro-$VERSION.zip" --clobber
          else
            gh release create "$TAG" "sbpro-$VERSION.zip" --target "$GITHUB_SHA" \
              --title "SBPRO $VERSION" --notes-file dos/RELEASE.md
          fi
